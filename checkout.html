<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">

<style>
   body {
    font-family: 'Noto Sans JP', sans-serif;
    margin: 0;
    padding: 0;
    background-color: #c1d4f7; /* pale pastel blue */
    color: #203864; /* deep navy blue */
}

.container {
    max-width: 400px;
    margin: 30px auto;
    padding: 25px 20px;
    background-color: #ffffff;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(32, 56, 100, 0.1); /* navy shadow */
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    font-size: 24px;
    color: #375a9b; /* medium indigo-blue */
    font-weight: 700;
}

.order-summary {
    border: 1px solid #a9c0e8; /* soft light blue border */
    border-radius: 8px;
    padding: 20px;
    background-color: #f0f5ff; /* very light blue background */
    margin-bottom: 30px;
    text-align: left;
    line-height: 1.6;
}

.order-summary img {
    max-width: 100%;
    border-radius: 8px;
    margin-bottom: 15px;
    display: block;
    margin-left: auto;
    margin-right: auto;
}

.order-summary h2 {
    font-size: 18px;
    margin: 10px 0 15px;
    color: #203864;
    font-weight: 600;
    text-align: center;
}

.order-summary p {
    margin: 8px 0;
    font-size: 16px;
    color: #375a9b;
}

.order-summary .price {
    font-size: 20px;
    font-weight: bold;
    color: #375a9b;
    text-align: center;
    margin-top: 20px;
}

.confirmation-text {
    font-size: 15px;
    color: #203864;
    margin-bottom: 20px;
    text-align: center;
}

#paypal-button-container {
    margin-top: 25px;
    text-align: center;
    padding: 15px;
    border: 1px solid rgba(55, 90, 155, 0.2);
    border-radius: 10px;
    box-shadow: 0 0 8px rgba(55, 90, 155, 0.1);
}

footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: #375a9b;
}

@media (max-width: 768px) {
    .container {
        padding: 20px 15px;
        margin: 15px;
    }

    header h1 {
        font-size: 20px;
    }

    .order-summary p, .order-summary h2 {
        font-size: 14px;
    }

    .order-summary .price {
        font-size: 18px;
    }
}

</style>

<body>
    <main class="container">
        <header>
            <h1>FOMO Leaks</h1>
        </header>

   // <div class="confirmation-text">
   //     Please review your pre-order details below before completing your payment.
 //   </div>

    <section class="order-summary" aria-label="Order summary">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRrKCG12c0AEx0QHQFJjws8qTAUYTS6Bg5jcvf95U1_g&s=10" alt="MOFO Album">
        <h2>Order Summary</h2>
        <p><strong>Product:</strong> FOMO 2026 — Unreleased</p>
        <p><strong>Quantity:</strong> 1</p>
        <p class="price">Total: $5.00 USD</p>
    </section>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRrKCG12c0AEx0QHQFJjws8qTAUYTS6Bg5jcvf95U1_g&s=10" alt="Secure Payment" style="display:block; margin: 0 auto 20px; height: 65px;">

    <section id="paypal-button-container" aria-label="Payment via PayPal">
        <!-- PayPal button will appear here -->
    </section>

    <footer>
        <p>© 2026 Kivara. Secure payment processing.</p>
    </footer>
</main>

       <!-- PayPal Button -->

<script src="https://www.paypal.com/sdk/js?client-id=AdLR3TPeggfb34nl3xX9eqr6thnqQHrKsZKR-ATlE6vBcp45q4MygaGm-_U7ytZ8meom-gmXOxXYGFgC&currency=USD"></script>

<script>
    // Get the price text from the page
    const priceText = document.querySelector('.price').textContent;  // "Total: $5.00 USD"

    // Extract the numeric part (remove non-digit and non-dot chars)
    const priceNumber = priceText.replace(/[^\d.]/g, '');  // "5.00"

    paypal.Buttons({
        createOrder: function(data, actions) {
            return actions.order.create({
                purchase_units: [{
                    amount: {
                        value: priceNumber  // dynamically set price here
                    }
                }]
            });
        },
        onApprove: function(data, actions) {
            return actions.order.capture().then(function(details) {
                alert('Payment completed successfully by ' + details.payer.name.given_name);
                window.location.href = "Obrigado.html";
            });
        }
    }).render('#paypal-button-container');
</script>

    </div>
  


<!-- Spinner and message -->

<div id="loading-overlay">
    <div id="spinner"></div>
    <p>Please wait...</p>
</div>

<!-- Spinner Style -->

<style>
    #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.9);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #spinner {
        border: 6px solid #f3f3f3;
        border-top: 6px solid #ff66b2;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    #loading-overlay p {
        margin-top: 15px;
        font-size: 16px;
        color: #4a004e;
    }
</style>

<!-- Script -->

<script>
    // Function to check if PayPal elements have loaded
    function checkPayPalLoaded() {
        const paypalButton = document.querySelector("#paypal-button-container iframe");
        const paypalCreditCard = document.querySelector(".paypal-buttons-context-iframe");

        // Check if both elements exist
        if (paypalButton && paypalButton.offsetParent !== null && paypalCreditCard && paypalCreditCard.offsetParent !== null) {
            // Remove spinner when elements are available
            document.getElementById("loading-overlay").style.display = "none";
        } else {
            // Keep checking until PayPal loads
            setTimeout(checkPayPalLoaded, 500); // Adjusted for mobile devices
        }
    }

    // Wait until the page has fully loaded before starting the check
    window.onload = function () {
        checkPayPalLoaded();
    };
</script>

</body>
</html>
